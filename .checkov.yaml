# Checkov configuration for the module registry.
#
# Scans the module sources for security misconfiguration. A small set of checks
# is skipped where the control is a per-consumer decision the base module cannot
# make on the caller's behalf; each skip is justified below.

framework:
  - terraform

directory:
  - modules

quiet: true
compact: true
download-external-modules: false

skip-check:
  # Server access logging is exposed as an optional input (`logging`); a base
  # bucket module cannot hardcode a central log-target bucket for every caller.
  - CKV_AWS_18
  # Cross-region replication is a per-consumer durability decision, not a
  # property every bucket should carry.
  - CKV_AWS_144
  # Event notifications are opt-in and consumer-specific.
  - CKV2_AWS_62
  # Restricting the account default security group is an account-baseline
  # concern owned elsewhere, not something a per-VPC module should manage.
  - CKV2_AWS_12
  # Public-access blocking IS configured, but every flag is driven by the
  # `block_public_access` input (all four default to true). Checkov evaluates the
  # literal value and cannot resolve a variable, so it reports the module as
  # unblocked; the defaults in variables.tf are the real answer.
  - CKV_AWS_53
  - CKV_AWS_54
  - CKV_AWS_55
  - CKV_AWS_56
  # Same root cause one level up: the block exists as a dedicated
  # aws_s3_bucket_public_access_block resource, which this check does not
  # associate with the bucket when both come from a module.
  - CKV2_AWS_6
  # The lifecycle configuration does abort incomplete multipart uploads, via a
  # dynamic rule gated on `abort_incomplete_multipart_days`; the check reads the
  # static block and misses it.
  - CKV_AWS_300
  # Flow-log retention is a caller-supplied input rather than a fixed period.
  - CKV_AWS_338
